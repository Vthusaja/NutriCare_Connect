spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: nutricare-connect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nutricare?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          time_zone: Asia/Colombo
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:harshithayasiru34@gmail.com}
    password: ${MAIL_PASSWORD:tlgsocvpigktrfbz}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: ${PORT:8080}
  error:
    include-message: always
nutricare:
  jwt-secret: ${JWT_SECRET:academic-demo-secret-change-before-deployment}
  jwt-minutes: 30
  demo-notifications: ${DEMO_NOTIFICATIONS:true}
  web-origin: ${WEB_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  mail:
    live-enabled: ${MAIL_LIVE_ENABLED:true}
    from: ${MAIL_FROM:harshithayasiru34@gmail.com}
